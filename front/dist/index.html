    <script type="text/javascript">
      // SPA fallback decoder for GitHub Pages — works with public/404.html.
      // Converts /?/some/path back into /some/path before React Router boots.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
