<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Charly FLU portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License — https://github.com/rafgraph/spa-github-pages
      // Rewrites the unknown URL into a query string and reloads "/" so that
      // index.html serves the SPA, which then restores the original URL via
      // history.replaceState (see the matching snippet in index.html).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
